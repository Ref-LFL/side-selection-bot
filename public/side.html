<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimesUp | Timer Tracker</title>
    <meta name="theme-color" content="#070b17" />
    <link rel="icon" type="image/png" href="./assets/timesup-logo.png" />
    <link rel="shortcut icon" href="./assets/timesup-logo.png" />
    <link rel="apple-touch-icon" href="./assets/timesup-logo.png" />
    <link rel="stylesheet" href="./side.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel" aria-labelledby="page-title">
        <div class="panel__noise" aria-hidden="true"></div>
        <div class="panel__glow panel__glow--blue" aria-hidden="true"></div>
        <div class="panel__glow panel__glow--red" aria-hidden="true"></div>
        <div class="panel__logo" aria-hidden="true"></div>

        <div class="brand-lockup">
          <p class="eyebrow">Side Selection</p>
          <h1 id="page-title">Timer Tracker</h1>
        </div>

        <div id="countdown" class="countdown" aria-live="polite">05:00</div>

        <div class="progress" aria-hidden="true">
          <div id="progress-fill" class="progress__fill"></div>
        </div>

        <div class="tracker-note" aria-label="Tracker note">
          <p class="tracker-note__title">Discord Controls Only</p>
          <p class="tracker-note__text">Use the Discord message to choose, lock, or cancel the side.</p>
        </div>

        <p id="status" class="status">Waiting for side selection...</p>
        <p id="meta" class="meta">Track the live timer here. Side actions happen in Discord.</p>
      </section>
    </main>

    <script src="./side-config.js"></script>
    <script type="module" src="./side.js"></script>
  </body>
</html>
